[package]
name = "cosyee-client"
version = "0.1.0"
description = "Cosyee 轻量客户端"
edition = "2021"

[lib]
# 移动端需要 staticlib / cdylib
name = "cosyee_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 体积优先
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
