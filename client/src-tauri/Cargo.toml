[package]
name = "cosyee-client"
version = "0.1.0"
description = "Cosyee 轻量客户端"
edition = "2021"

[lib]
# 移动端需要 staticlib / cdylib
name = "cosyee_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-proxy"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "sync", "macros"] }
ureq = { version = "3", default-features = false, features = ["rustls", "rustls-webpki-roots", "win-system-proxy", "socks-proxy"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = "0.10"
base64 = "0.22"
semver = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[target.'cfg(target_os = "android")'.dependencies]
libloading = "0.8"
jni = "0.21"

# 体积优先
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
