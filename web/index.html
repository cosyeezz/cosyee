<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cosyee</title>
    <script>
      // 首帧之前按保存的选择定好深浅，避免先闪一下深色（与 src/core/theme.ts 同一个键）
      try {
        var t = localStorage.getItem('cz-theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <script type="module" crossorigin src="/assets/index-C1n0S0QF.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DPSafptI.css">
  </head>

  </body>
</html>
