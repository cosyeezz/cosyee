# 发布流水线：推送 v* 标签（例如 git tag v0.2.0 && git push origin v0.2.0）时
#   - Windows：NSIS 安装包 + 免安装 exe
#   - macOS：通用（Intel + Apple 芯片）dmg，ad-hoc 签名（未公证，首次打开需 xattr -cr）
#   - Android：arm64 APK（用仓库 secrets 里的密钥签名）
#   - 独立服务端包：给需要本地后端的电脑用
# 全部上传到同名 GitHub Release。手动触发（workflow_dispatch）只构建、产物留在 Actions 里，不发 Release。
#
# 需要的仓库 secrets：
#   Android 签名（换密钥会导致已安装的旧版本无法覆盖升级）：
#     ANDROID_KEYSTORE_B64       PKCS12 密钥库的 base64
#     ANDROID_KEYSTORE_PASSWORD  密钥库密码
#     ANDROID_KEY_ALIAS          密钥别名
#   桌面端自动更新签名（tauri-plugin-updater 的 minisign 私钥，对应 tauri.conf.json 中的 pubkey）：
#     TAURI_SIGNING_PRIVATE_KEY           私钥内容
#     TAURI_SIGNING_PRIVATE_KEY_PASSWORD  私钥密码（无密码时可留空）
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  NODE_VERSION: '24'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" == v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(node -p "require('./client/src-tauri/tauri.conf.json').version")-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "版本：$v"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: 检查更新签名 secrets
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::缺少桌面端更新签名 secrets（TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD）"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: client/src-tauri }
      - run: npm ci
      - name: 写入版本号
        shell: bash
        run: node client/scripts/set-version.mjs "$VERSION"
      - name: 构建
        working-directory: client
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis
      - name: 整理产物
        shell: bash
        run: |
          mkdir -p out
          cp client/src-tauri/target/release/bundle/nsis/*-setup.exe "out/Cosyee_${VERSION}_windows_x64_setup.exe"
          cp client/src-tauri/target/release/bundle/nsis/*-setup.exe.sig "out/Cosyee_${VERSION}_windows_x64_setup.exe.sig"
          cp client/src-tauri/target/release/Cosyee.exe "out/Cosyee_${VERSION}_windows_x64_portable.exe"
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: out/*, if-no-files-found: error }

  macos:
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: 检查更新签名 secrets
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::缺少桌面端更新签名 secrets（TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD）"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-apple-darwin,x86_64-apple-darwin' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: client/src-tauri }
      - run: npm ci
      - name: 写入版本号
        run: node client/scripts/set-version.mjs "$VERSION"
      - name: 构建
        working-directory: client
        env:
          # 与 tauri.conf.json 的 minimumSystemVersion 保持一致
          MACOSX_DEPLOYMENT_TARGET: '10.15'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg
      - name: 校验 macOS 14+ 符号为弱引用（否则 macOS 10.15–13 上起不来）
        run: |
          bin=client/src-tauri/target/universal-apple-darwin/release/Cosyee
          for arch in x86_64 arm64; do
            syms=$(nm -m -arch "$arch" "$bin" | grep -E '_nw_proxy_config_create_(http_connect|socksv5)' || true)
            echo "[$arch]"; echo "$syms"
            [ -n "$syms" ] || { echo "::error::没找到 nw_proxy_config 符号（wry 变了？）"; exit 1; }
            if echo "$syms" | grep -qv 'weak'; then
              echo "::error::$arch 上 nw_proxy_config_* 不是弱引用，旧版 macOS 会启动失败（检查 build.rs 的 -weak_framework Network）"; exit 1
            fi
          done
      - name: 整理产物
        run: |
          mkdir -p out
          cp client/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "out/Cosyee_${VERSION}_macos_universal.dmg"
          cp client/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz "out/Cosyee_${VERSION}_macos_universal.app.tar.gz"
          cp client/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig "out/Cosyee_${VERSION}_macos_universal.app.tar.gz.sig"
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: out/*, if-no-files-found: error }

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: 检查签名 secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AL: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ] || [ -z "$AL" ]; then
            echo "::error::缺少 Android 签名 secrets（ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS）"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - uses: actions/setup-go@v5
        with:
          go-version-file: tailnet/go.mod
          cache-dependency-path: tailnet/go.sum
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: client/src-tauri }
      - name: NDK
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          ls "$ANDROID_NDK_LATEST_HOME" > /dev/null
      - run: npm ci
      - name: 写入版本号
        run: node client/scripts/set-version.mjs "$VERSION"
      - name: 构建内置 Tailscale 库（android-arm64）
        run: |
          tv="$(tr -d '\r\n' < tailnet/VERSION)"
          echo "COSYEE_TAILNET_VERSION=$tv" >> "$GITHUB_ENV"
          node tailnet/scripts/build.mjs --target android-arm64 --version "$tv" --out-dir tailnet/dist
          so="tailnet/dist/libcosyee_tailnet_${tv}_android_arm64.so"
          [ -f "$so" ] || { echo "::error::找不到构建好的 $so"; exit 1; }
      - name: 生成 Android 工程
        working-directory: client
        run: |
          npx tauri android init --ci
          gradle=src-tauri/gen/android/app/build.gradle.kts
          # release 包默认禁止明文 http；服务端走 Tailscale 内网的 http://100.x.x.x:7878，必须放开
          sed -i 's/manifestPlaceholders\["usesCleartextTraffic"\] = "false"/manifestPlaceholders["usesCleartextTraffic"] = "true"/' "$gradle"
          if grep -q 'usesCleartextTraffic"\] = "false"' "$gradle"; then
            echo "::error::没能放开 usesCleartextTraffic（Tauri 模板变了？）"; exit 1
          fi
          grep -q 'usesCleartextTraffic' src-tauri/gen/android/app/src/main/AndroidManifest.xml \
            || { echo "::error::AndroidManifest.xml 里没有 usesCleartextTraffic 占位"; exit 1; }
          # 内置 Tailscale 代理依赖 androidx.webkit 的 ProxyController；Tauri 模板通常已包含，缺失时自动补上
          if ! grep -q 'androidx.webkit:webkit' "$gradle"; then
            sed -i 's/dependencies {/dependencies {\n    implementation("androidx.webkit:webkit:1.12.1")/' "$gradle"
          fi
          grep -q 'androidx.webkit:webkit' "$gradle" \
            || { echo "::error::未能确保 androidx.webkit 依赖"; exit 1; }
          # R8 保留 Rust 经 JNI 调用的 MainActivity 方法，先确认模板会自动收集 app 目录下的 **/*.pro
          if ! (grep -q 'proguardFiles' "$gradle" && grep -q 'include("\*\*/\*\.pro")' "$gradle"); then
            echo "::error::build.gradle.kts 未自动收集 **/*.pro（Tauri 模板变了？）"; exit 1
          fi
          cp android/proguard-cosyee.pro src-tauri/gen/android/app/proguard-cosyee.pro
          # 打进 APK 的内置 Tailscale 动态库
          mkdir -p src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a
          cp "../tailnet/dist/libcosyee_tailnet_${COSYEE_TAILNET_VERSION}_android_arm64.so" \
            src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/libcosyee_tailnet.so
          # 语音输入要用麦克风（运行时由 WebView 的权限请求触发系统授权弹窗）
          manifest=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' "$manifest"
          grep -q 'RECORD_AUDIO' "$manifest" || { echo "::error::没能加上 RECORD_AUDIO 权限"; exit 1; }
          # 下载完的 APK 从应用里打开要拉起安装器（Android 8+ 来源应用必须声明这项，用户还会被要求允许「安装未知应用」）
          sed -i 's#<application#<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application#' "$manifest"
          grep -q 'REQUEST_INSTALL_PACKAGES' "$manifest" || { echo "::error::没能加上 REQUEST_INSTALL_PACKAGES 权限"; exit 1; }
          # MainActivity 打开下载文件用模板自带的 FileProvider（Android 9 及以下）
          grep -q 'androidx.core.content.FileProvider' "$manifest" \
            || { echo "::error::AndroidManifest.xml 里没有 FileProvider（Tauri 模板变了？）"; exit 1; }
          # 应用图标
          cp -r src-tauri/icons/android/* src-tauri/gen/android/app/src/main/res/
          # 自己的 MainActivity：系统栏 / 输入法避让交给页面、返回手势回到服务器列表（见文件头注释）
          act=$(find src-tauri/gen/android/app/src/main/java -name MainActivity.kt | head -n1)
          [ -n "$act" ] || { echo "::error::找不到生成的 MainActivity.kt（Tauri 模板变了？）"; exit 1; }
          cp android/MainActivity.kt "$act"
      - name: 构建
        working-directory: client
        run: npx tauri android build --apk --target aarch64 --ci
      - name: 签名
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          apk=$(find client/src-tauri/gen/android/app/build/outputs/apk -name '*release-unsigned.apk' | head -n1)
          [ -n "$apk" ] || { echo "::error::找不到未签名的 APK"; find client/src-tauri/gen/android/app/build/outputs -type f; exit 1; }
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.p12"
          mkdir -p out
          "$bt/zipalign" -f -p 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --ks-key-alias "$ALIAS" \
            --out "out/Cosyee_${VERSION}_android_arm64.apk" "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" verify --print-certs "out/Cosyee_${VERSION}_android_arm64.apk"
          rm -f "$RUNNER_TEMP/release.p12"
          ls -la out
      - name: 校验 APK 内容（R8 保留方法与内置 .so）
        run: |
          apk="out/Cosyee_${VERSION}_android_arm64.apk"
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libcosyee_tailnet.so' \
            || { echo "::error::APK 中缺少 lib/arm64-v8a/libcosyee_tailnet.so"; exit 1; }
          unzip -p "$apk" 'classes*.dex' > "$RUNNER_TEMP/all.dex"
          for sym in setTailnetProxy clearTailnetProxy relaunchApp; do
            grep -aq "$sym" "$RUNNER_TEMP/all.dex" \
              || { echo "::error::APK dex 中缺少方法（可能被 R8 裁剪）：$sym"; exit 1; }
          done
          rm -f "$RUNNER_TEMP/all.dex"
          echo "APK 校验通过：libcosyee_tailnet.so 与 3 个 JNI 方法均存在"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/*, if-no-files-found: error }

  server:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - name: 打包
        run: COSYEE_VERSION="$VERSION" npm run pack:server
      - name: 压缩
        run: |
          mkdir -p out
          (cd server/dist && zip -qr "../../out/cosyee-server_${VERSION}.zip" cosyee-server)
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: server, path: out/*, if-no-files-found: error }

  release:
    if: github.ref_type == 'tag'
    needs: [version, windows, macos, android, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: 生成自动更新清单 latest.json
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("node:fs");
            const ver = process.env.VERSION;
            const tag = process.env.TAG;
            const repo = process.env.GITHUB_REPOSITORY;
            const base = `https://github.com/${repo}/releases/download/${tag}`;
            const winSig = fs.readFileSync(`out/Cosyee_${ver}_windows_x64_setup.exe.sig`, "utf8").trim();
            const macSig = fs.readFileSync(`out/Cosyee_${ver}_macos_universal.app.tar.gz.sig`, "utf8").trim();
            const macEntry = {
              signature: macSig,
              url: `${base}/Cosyee_${ver}_macos_universal.app.tar.gz`,
            };
            const manifest = {
              version: ver,
              notes: `Cosyee ${tag}`,
              pub_date: new Date().toISOString(),
              platforms: {
                "windows-x86_64": {
                  signature: winSig,
                  url: `${base}/Cosyee_${ver}_windows_x64_setup.exe`,
                },
                "darwin-x86_64": macEntry,
                "darwin-aarch64": macEntry,
                // Android 不走 updater 插件，只用 url；signature 留空串是因为插件反序列化时每个平台都必须有该字段，缺了整个清单解析失败
                "android-aarch64": {
                  signature: "",
                  url: `${base}/Cosyee_${ver}_android_arm64.apk`,
                },
              },
            };
            fs.writeFileSync("out/latest.json", JSON.stringify(manifest, null, 2) + "\n");
          '
          rm -f out/*.sig
          cat out/latest.json
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la out
          cat > notes.md <<'EOF'
          ## 下载

          | 平台 | 文件 |
          | --- | --- |
          | Windows | `*_windows_x64_setup.exe`（安装版）或 `*_windows_x64_portable.exe`（免安装，需系统自带 WebView2） |
          | macOS | `*_macos_universal.dmg`。未经 Apple 公证，拖进「应用程序」后在终端执行一次 `xattr -cr /Applications/Cosyee.app` |
          | Android | `*_android_arm64.apk` |
          | 本地后端 | `cosyee-server_*.zip`，需要 Node.js 24+ 和已登录的 Claude Code CLI，解压后运行 `start.cmd` / `start.sh` |

          客户端只是外壳：打开后添加服务端地址（Tailscale IP 或机器名，端口默认 7878）。
          EOF
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --title "Cosyee $TAG" --notes-file notes.md
